                <span class="navbar-toggler-icon"></span>

                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="personajes.html">Personajes</a></li>

    <header class="hero">
        <div class="hero-overlay">
            <div class="container text-center">
                <h1 class="display-4 fw-bold titulo">Contenido Adulto</h1>
                <p class="text-muted">Buscador conectado vía API</p>
            </div>
        </div>
    </header>

    <div class="container my-4">
        <div class="glass p-4">
            <div class="row g-3 align-items-center">
                <div class="col-lg-8">
                    <div class="position-relative">
                        <input id="buscadorTags" class="form-control form-control-lg"
                            placeholder="Ej: rem emilia echidna">
                        <div id="sugerenciasTags" class="list-group position-absolute w-100 mt-1" style="z-index:999">
                        </div>
                    </div>
                </div>

                <div class="col-lg-2">
                    <select id="tipoContenido" class="form-select form-select-lg">
                        <option value="imagen" selected>🖼️ Imágenes</option>
                        <option value="video">🎞️ Videos / GIF</option>
                    </select>
                </div>

                <div class="col-lg-2 d-grid">
                    <button class="btn btn-primary-custom btn-lg" onclick="buscarPorTags()">
                        Buscar
                    </button>
                </div>
            </div>
        </div>
    </div>


    <div class="container mb-5">
        <div id="galeria18" class="row g-4 justify-content-center"></div>

        <div class="d-flex justify-content-center mt-4" id="paginacion18"></div>
    </div>


    <div id="capa-visualizador">
        <span class="cerrar-visor">&times;</span>

        <img class="img-grande shadow-lg rounded" id="imgGrande" alt="Imagen ampliada">

        <video id="videoGrande" class="img-grande shadow-lg rounded" controls loop style="display:none"></video>
